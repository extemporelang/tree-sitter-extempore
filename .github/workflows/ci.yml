name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Generate, test and check queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # editors build src/parser.c from the repo, so it must match grammar.js
      - name: Generated parser is up to date
        run: |
          tree-sitter generate
          git diff --exit-code -- src

      - name: Corpus and highlight tests
        run: tree-sitter test

      - name: Queries are valid and formatted
        run: |
          tree-sitter build -o build/extempore.so
          ts_query_ls check --format "$PWD/queries"

  corpus:
    name: Parse the Extempore source tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Checkout Extempore (.xtm sources only)
        uses: actions/checkout@v7
        with:
          repository: digego/extempore
          path: extempore
          # The grammar tracks the language, so test against the tip of master.
          ref: master

      - name: Parse every .xtm file (fail on any parse error)
        run: ./script/parse-corpus.sh extempore
